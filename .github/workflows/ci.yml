name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ai-agora:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container and check the health endpoint
        run: |
          docker run -d --name agora-ci -p 8080:8000 \
            -e DEMO_MODE=1 \
            -e AGORA_DB_PATH=/data/agora.db \
            -e UPLOAD_DIR=/data/uploads \
            ai-agora:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then
              echo
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "container did not become healthy, logs follow:"
          docker logs agora-ci
          exit 1
