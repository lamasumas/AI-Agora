  <path d="M14 24 L32 12 L50 24" stroke="#06b6d4" stroke-width="1.5" fill="none"/>
  
  <!-- Architrave (beam under roof) -->
  <rect x="12" y="24" width="40" height="3" fill="#06b6d4" opacity="0.7"/>
  
  <!-- Columns -->
  <rect x="15" y="27" width="3.5" height="22" rx="1" fill="#06b6d4" opacity="0.85"/>
  <rect x="22" y="27" width="3.5" height="22" rx="1" fill="#06b6d4" opacity="0.85"/>
  <rect x="29" y="27" width="3.5" height="22" rx="1" fill="#06b6d4" opacity="0.85"/>
  <rect x="36" y="27" width="3.5" height="22" rx="1" fill="#06b6d4" opacity="0.85"/>
  <rect x="43" y="27" width="3.5" height="22" rx="1" fill="#06b6d4" opacity="0.85"/>
  
  <!-- Column capitals (tops) -->
  <rect x="14" y="26" width="5.5" height="2" rx="0.5" fill="#06b6d4" opacity="0.9"/>
  <rect x="21" y="26" width="5.5" height="2" rx="0.5" fill="#06b6d4" opacity="0.9"/>
  <rect x="28" y="26" width="5.5" height="2" rx="0.5" fill="#06b6d4" opacity="0.9"/>
  <rect x="35" y="26" width="5.5" height="2" rx="0.5" fill="#06b6d4" opacity="0.9"/>
  <rect x="42" y="26" width="5.5" height="2" rx="0.5" fill="#06b6d4" opacity="0.9"/>
  
  <!-- Base/steps -->
  <rect x="10" y="49" width="44" height="3" rx="1" fill="#06b6d4" opacity="0.6"/>
  <rect x="8" y="52" width="48" height="3" rx="1" fill="#06b6d4" opacity="0.4"/>
  
  <!-- Center door/opening -->
  <rect x="27" y="34" width="10" height="15" rx="1" fill="#080b12"/>
