<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#080b12"/>
  <circle cx="32" cy="32" r="29" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
  
  <!-- Temple/Agora columns -->
